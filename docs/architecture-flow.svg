<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Personality Physics architecture</title>
<desc id="desc">World State flows through Stimulus Detection, Personality Priorities, Decision Resolver, Action, Updated World State, and Next Character Reaction.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#061f35"/>
    <stop offset="1" stop-color="#0a527c"/>
  </linearGradient>
  <linearGradient id="node" x1="0" x2="1">
    <stop offset="0" stop-color="#f8fdff"/>
    <stop offset="1" stop-color="#e6f8ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#001522" flood-opacity=".28"/>
  </filter>
</defs>
<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<text x="48" y="48" fill="#bfeeff" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">DETERMINISTIC DECISION LOOP</text>
<text x="48" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" opacity=".78">The UI renders consequences; it does not choose them.</text>
<g font-family="Arial, sans-serif" font-weight="700" font-size="15" text-anchor="middle">
  <g filter="url(#shadow)">
    <rect x="48" y="126" width="132" height="70" rx="18" fill="url(#node)"/><text x="114" y="155" fill="#082b45"><tspan x="114">World</tspan><tspan x="114" dy="20">State</tspan></text>
    <rect x="210" y="126" width="142" height="70" rx="18" fill="url(#node)"/><text x="281" y="155" fill="#082b45"><tspan x="281">Stimulus</tspan><tspan x="281" dy="20">Detection</tspan></text>
    <rect x="382" y="126" width="150" height="70" rx="18" fill="#fff3a8"/><text x="457" y="155" fill="#594400"><tspan x="457">Personality</tspan><tspan x="457" dy="20">Priorities</tspan></text>
    <rect x="562" y="126" width="152" height="70" rx="18" fill="#d9f8e7"/><text x="638" y="155" fill="#104b30"><tspan x="638">Decision</tspan><tspan x="638" dy="20">Resolver</tspan></text>
    <rect x="744" y="126" width="112" height="70" rx="18" fill="url(#node)"/><text x="800" y="167" fill="#082b45">Action</text>
    <rect x="886" y="126" width="140" height="70" rx="18" fill="url(#node)"/><text x="956" y="155" fill="#082b45"><tspan x="956">Updated</tspan><tspan x="956" dy="20">World State</tspan></text>
    <rect x="1056" y="126" width="110" height="70" rx="18" fill="#ffe5d8"/><text x="1111" y="150" fill="#753819"><tspan x="1111">Next</tspan><tspan x="1111" dy="18">Character</tspan><tspan x="1111" dy="18">Reaction</tspan></text>
  </g>
</g>
<g stroke="#8bdcf6" stroke-width="4" fill="none" stroke-linecap="round">
  <path d="M180 161h24"/><path d="M352 161h24"/><path d="M532 161h24"/><path d="M714 161h24"/><path d="M856 161h24"/><path d="M1026 161h24"/>
</g>
<g fill="#8bdcf6">
  <path d="M204 161l-9-6v12z"/><path d="M376 161l-9-6v12z"/><path d="M556 161l-9-6v12z"/><path d="M738 161l-9-6v12z"/><path d="M880 161l-9-6v12z"/><path d="M1050 161l-9-6v12z"/>
</g>
<path d="M1110 208 C1110 255, 115 255, 115 208" fill="none" stroke="#ffe56a" stroke-width="3" stroke-dasharray="8 8" opacity=".85"/>
<path d="M115 208l-7 12h14z" fill="#ffe56a"/>
<text x="610" y="273" fill="#ffe56a" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">WORLD UPDATE FEEDS THE NEXT DECISION — SAME STATE, SAME TRACE</text>
</svg>