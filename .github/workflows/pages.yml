name: Portfolio site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run deterministic engine tests
        run: npm test

      - name: Build static portfolio artifact
        run: |
          mkdir -p dist/assets dist/docs
          cp index.html styles.css app.js engine.js personalities.js world.js scenarios.js ui.js animations.js dist/
          cp -R assets/. dist/assets/
          cp docs/butterfly-demo.svg docs/butterfly-demo.gif dist/docs/
          test -s dist/index.html
          test -s dist/engine.js
          test -s dist/docs/butterfly-demo.gif

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static portfolio artifact
        run: |
          mkdir -p dist/assets dist/docs
          cp index.html styles.css app.js engine.js personalities.js world.js scenarios.js ui.js animations.js dist/
          cp -R assets/. dist/assets/
          cp docs/butterfly-demo.svg docs/butterfly-demo.gif dist/docs/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
